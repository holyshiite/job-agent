<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dani's Job Board Agent</title>
<style>
:root{color-scheme:light;--bg:#f6f5fa;--panel:#fff;--ink:#21213a;--muted:#55566f;--line:#e4e1ee;--accent:#5140ad;--soft:#eeeaff;--green:#196345;--green-bg:#e5f4ed}
:root[data-theme=dark]{color-scheme:dark;--bg:#171624;--panel:#222137;--ink:#f5f3fc;--muted:#c7c4da;--line:#403c58;--accent:#c9bcff;--soft:#383053;--green:#a8e6ca;--green-bg:#23463a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:18px;background:#21213a;color:white;padding:18px 28px}h1,h2,h3,p{margin:0}h1{font-size:clamp(20px,3vw,28px)}h2{font-size:24px}h3{font-size:17px}.brand{display:flex;align-items:center;gap:12px}.mark{border-radius:8px;padding:7px 11px;color:#21213a;background:#c9bcff;font-weight:800}.meta{display:flex;gap:14px;align-items:center;text-align:right}.meta small{display:block;color:#ddd8f5}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:7px 12px}button:disabled{opacity:.55;cursor:default}button:not(:disabled):hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:#5140ad;color:#fff;border-color:#5140ad;font-weight:700}.soft,[aria-selected=true],[aria-pressed=true]{background:var(--soft);color:var(--accent);font-weight:700}.filters,nav{background:var(--panel);padding:12px 26px;border-bottom:1px solid var(--line)}nav,.chips,.flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.spread{justify-content:space-between}.filter-row{margin-top:8px;display:flex;gap:10px;align-items:baseline}.filter-row strong{width:90px;flex-shrink:0}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer}.chip:has(input:checked){background:var(--soft);color:var(--accent)}input[type=checkbox]{accent-color:#6956c8}.workspace{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;padding:22px 24px;align-items:start}.workspace.open{grid-template-columns:220px minmax(0,1fr) 360px}.panel{background:var(--panel);border-radius:12px;padding:18px;min-width:0}.stack{display:grid;gap:12px}.minor{color:var(--muted);font-size:13px}.badge{background:var(--green-bg);color:var(--green);font-weight:800;border-radius:20px;padding:4px 10px;white-space:nowrap}details{background:var(--bg);border-radius:7px;padding:7px 9px}summary{cursor:pointer;font-weight:650}details button{display:block;text-align:left;border:0;background:none;color:var(--accent);padding:6px 4px}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:10px 8px;border-bottom:1px solid var(--line)}th{background:var(--bg);font-size:12px;color:var(--muted)}tr.active{background:var(--soft)}.title-button{border:0;background:none;padding:0;text-align:left;font-weight:750;color:var(--accent)}.table-scroll{overflow:auto}.drawer{animation:slide .24s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}.single{margin:22px 24px}.analysis{background:var(--bg);padding:12px;border-radius:8px}ul{margin:6px 0 0;padding-left:20px}dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(640px,94vw);max-height:88vh;padding:20px}dialog::backdrop{background:#12112288}input:not([type=checkbox]),select,textarea{max-width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);color:var(--ink)}textarea{width:100%;min-height:180px}a{color:var(--accent)}#status{padding:0 24px;color:var(--muted)}#status:empty{display:none}@media(max-width:1100px){.workspace.open{grid-template-columns:180px minmax(0,1fr)}.drawer{grid-column:2}.workspace{grid-template-columns:180px minmax(0,1fr)}}@media(max-width:690px){header{align-items:flex-start;padding:12px;flex-wrap:wrap}.meta{text-align:left}.filters,nav{padding:10px 12px}.workspace,.workspace.open{grid-template-columns:1fr;padding:12px}.drawer{grid-column:auto}.single{margin:12px}.filter-row{display:block}.filter-row strong{display:block;margin-bottom:4px}}@media(prefers-reduced-motion:reduce){.drawer{animation:none}}
.posting-link{display:inline-block;justify-self:start;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);font-weight:750;text-decoration:none}.posting-link:hover{text-decoration:underline}

.companion{position:fixed;inset:auto 18px 18px auto;z-index:3;border:0;background:#5140ad;color:#fff;box-shadow:0 6px 24px #28224a42;display:flex;gap:8px;align-items:center;font-weight:800;padding:10px 14px;border-radius:22px}
.companion-face{display:grid;place-items:center;width:31px;height:26px;background:#e5daff;color:#30225b;border-radius:11px;font-size:13px;letter-spacing:3px;padding-left:3px}
#companion-dialog{width:min(440px,calc(100vw - 24px));margin:auto 12px 12px auto;max-height:min(720px,calc(100dvh - 24px))}
#companion-dialog textarea{min-height:70px}#companion-dialog [hidden]{display:none}
.companion-log{max-height:270px;overflow:auto;display:grid;gap:9px}
.companion-message{border-radius:8px;background:var(--bg);padding:9px 12px;white-space:pre-wrap;overflow-wrap:anywhere}.companion-message.user{background:var(--soft)}

.companion{isolation:isolate;overflow:visible;gap:10px;padding:8px 15px 8px 9px;border-radius:28px}
.mascot{width:43px;height:43px;display:grid;place-items:center;position:relative;flex:none}
.mascot-face{width:33px;height:29px;border-radius:48% 48% 44% 44%;position:relative;z-index:1;background:#eee3ff;border:1.5px solid #31215d;color:#31215d;box-shadow:inset 0 -4px #d9c7f8;display:flex;justify-content:center;gap:7px;align-items:flex-start;padding-top:9px}
.mascot-face:before,.mascot-face:after{content:"";width:4px;height:5px;background:#31215d;border-radius:50%}
.mascot-mouth{position:absolute;width:7px;height:4px;border-bottom:2px solid #31215d;border-radius:0 0 50% 50%;top:16px;left:11px}
.mascot-ear{position:absolute;top:4px;width:11px;height:12px;border:1.5px solid #31215d;background:#d9c7f8;border-radius:65% 65% 32% 32%;transform:rotate(-23deg);left:7px}
.mascot-ear.right{left:auto;right:7px;transform:rotate(23deg)}
.mascot-paw{position:absolute;bottom:5px;right:0;width:12px;height:10px;z-index:2;border:1.5px solid #31215d;border-radius:48%;background:#e5d3fb;transform-origin:20% 85%}
.mascot-effect{position:absolute;z-index:3;right:0;top:0;opacity:0;color:#fff;font-size:21px;line-height:1;text-shadow:0 1px 5px #34225e;pointer-events:none}
.mascot[data-emote=wave] .mascot-paw{animation:mascot-wave 1.25s ease-in-out both}
.mascot[data-emote=kiss] .mascot-mouth{width:5px;height:5px;border:1.5px solid #31215d;border-radius:50%;left:12px}
.mascot[data-emote=kiss] .mascot-effect{color:#ffb9dc;animation:mascot-float 1.4s ease-out both}
.mascot[data-emote=sparkle] .mascot-effect{color:#fff0a3;animation:mascot-float 1.4s ease-out both}
.mascot[data-emote=sparkle] .mascot-face{animation:mascot-tilt 1.15s ease both}
.mascot[data-emote=hop]{animation:mascot-hop 1.2s ease both}
.mascot[data-emote=wink] .mascot-face:after{height:2px;margin-top:3px}
.mascot[data-emote=wink] .mascot-face{animation:mascot-tilt 1.15s ease both}
@keyframes mascot-wave{0%,100%{transform:none}20%,55%{transform:translate(2px,-18px) rotate(32deg)}38%,72%{transform:translate(2px,-18px) rotate(-32deg)}}
@keyframes mascot-float{0%{opacity:0;transform:scale(.6)}25%,55%{opacity:1}100%{opacity:0;transform:translate(12px,-24px) rotate(14deg)}}
@keyframes mascot-tilt{0%,100%{transform:none}35%,65%{transform:rotate(-12deg)}}
@keyframes mascot-hop{0%,100%{transform:none}28%{transform:translateY(-8px) rotate(-8deg)}62%{transform:translateY(-5px) rotate(7deg)}}
@media(prefers-reduced-motion:reduce){.mascot,.mascot *{animation:none!important}.mascot-effect{display:none}}

#settings{--edge:clamp(8px,3vw,28px);width:min(760px,calc(100vw - 2 * var(--edge)));max-width:none;max-height:calc(100dvh - 2 * var(--edge));margin:var(--edge) auto auto;overscroll-behavior:contain;overflow:auto;padding:clamp(12px,3vw,24px)}
#settings[open]{animation:admin-slide-in .28s ease-out both}
#settings .stack,#settings .flex{min-width:0}
#settings input:not([type=checkbox]),#settings select,#settings textarea{min-width:0}
#settings label,#settings button,#settings .minor{overflow-wrap:anywhere}
@keyframes admin-slide-in{from{transform:translateY(-24px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){#settings[open]{animation:none}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">D</span><h1>Dani's Job Board Agent</h1></div><div class="meta"><div><strong id="today"></strong><small id="refresh"></small></div><button id="admin" class="soft">Admin</button></div></header>
<section id="filters" class="filters" aria-label="Job sources"></section>
<nav id="tabs" aria-label="Dashboard views"></nav>
<p id="status" aria-live="polite"></p><main id="view"></main>
<dialog id="settings"></dialog><dialog id="editor"></dialog>

<button class="companion" id="open-companion"><span class="mascot" id="job-mascot" aria-hidden="true"><span class="mascot-ear"></span><span class="mascot-ear right"></span><span class="mascot-face"><span class="mascot-mouth"></span></span><span class="mascot-paw"></span><span class="mascot-effect"></span></span>Job companion</button>
<dialog id="companion-dialog" aria-labelledby="companion-title">
  <div class="stack">
    <div class="flex spread"><h2 id="companion-title">Job companion</h2><button id="close-companion" type="button">Close</button></div>
    <div class="flex"><button id="configure-companion" type="button">Connect</button><button id="clear-companion" type="button">Clear chat</button></div>
    <form id="companion-connection" class="stack" hidden>
      <label>Backend URL <input name="endpoint" type="url" placeholder="https://your-worker.example/chat" required></label>
      <label>Companion access token <input name="credential" type="password" autocomplete="off" required></label>
      <button class="primary">Save connection</button>
      <p class="minor">Use the private token for your deployed companion backend.</p>
    </form>
    <p class="minor" id="companion-state" role="status"></p>
    <div class="companion-log" id="companion-log" role="log" aria-live="polite"></div>
    <form id="companion-form" class="stack">
      <label>Message <textarea name="question" maxlength="4000" required placeholder="What should I emphasize for this job?"></textarea></label>
      <label><input type="checkbox" name="job" checked> Include selected posting</label>
      <label><input type="checkbox" name="resume"> Share my résumé text with OpenAI for this message</label>
      <p class="minor">Recent chat messages are sent with each request. Clear chat before starting a fresh conversation.</p>
      <button class="primary" id="send-companion">Send</button>
    </form>
  </div>
</dialog>
<script type="module">
import {sites,feeds,identifyFeed,safeUrl,loadFeed,inspectCareerPage} from "./job-feeds.mjs";
const sampleJobs=[
 {id:'openai',source:'OpenAI',title:'Product Operations Lead',location:'San Francisco, CA',posted:'2026-11-25',match:96,role:'Lead launch planning, establish operating rhythms, and coordinate delivery across Product, Design, and Engineering.',reasons:['Cross-functional launch ownership aligns with the sample profile.','The role calls for operations metrics and stakeholder coordination.','Review the on-site expectations before applying.']},
 {id:'google',source:'Google',title:'Program Manager, Product',location:'Mountain View, CA',posted:'2026-11-24',match:92,role:'Coordinate product milestones, track dependencies, and report delivery risks.',reasons:['The sample profile emphasizes program planning and stakeholder alignment.','Confirm the scope of technical program ownership.']},
 {id:'apple',source:'Apple',title:'Business Operations Manager',location:'Cupertino, CA',posted:'2026-11-24',match:89,role:'Improve operational reporting and lead planning across business teams.',reasons:['Operational reporting and planning align with the sample profile.']},
 {id:'linkedin',source:'LinkedIn',title:'Strategy & Operations Lead',location:'Remote',posted:'2026-11-23',match:86,role:'Develop operating plans and evaluate strategic initiatives.',reasons:['The role emphasizes planning, metrics, and cross-functional execution.']},
 {id:'indeed',source:'Indeed',title:'Product Program Manager',location:'Remote',posted:'2026-11-22',match:82,role:'Maintain product delivery plans and support cross-team coordination.',reasons:['Delivery coordination aligns with the sample profile.']}
];
const defaults={sourceUrls:{},imports:[],archive:{},resumeText:'',pageAccess:{},theme:'light',sources:{companies:['Apple','Netflix','Google','Meta','Anthropic','OpenAI'],boards:['LinkedIn','Monster','Indeed','Jack & Jill']},selected:['Apple','Google','OpenAI','LinkedIn','Indeed'],saved:[],submitted:{},resumes:[]};
const key='dani-job-board-v1';
let state=structuredClone(defaults);
try{const previous=localStorage.getItem(key);if(previous)state={...state,...JSON.parse(previous)}}catch{}
const removalSelection={companies:new Set(),boards:new Set()};
let tab='matches',activeJob=null,sort='match',expanded=new Set(['OpenAI']);
const tabs={matches:'Matching jobs',resumes:'Résumé drafts',saved:'Saved postings',submitted:'Submitted'};
const $=id=>document.getElementById(id);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const date=s=>!s?'Unavailable':new Date(s.length===10?s+'T12:00:00':s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const lookup=id=>sampleJobs.find(job=>job.id===id)||state.archive[id];
const statuses=new Map();
let lastRefresh='',refreshing=false;
sampleJobs.push(...state.imports);
const sourceUrl=name=>safeUrl((Object.hasOwn(state.sourceUrls,name)?state.sourceUrls[name]:'')||(Object.hasOwn(sites,name)?sites[name]:''));
const remember=(s,id)=>{const job=lookup(id);if(job)s.archive[id]=job};
const words=text=>new Set((String(text).toLowerCase().match(/[a-z][a-z0-9+#.-]{2,}/g)||[]).filter(x=>!['the','and','with','for','you','your','our','this','that','are','will','have','from','job','role','all','can','who','years','work','team'].includes(x)));
let resumeTerms;
function assess(job){
 if(!job.url)return {score:job.match,reasons:job.reasons,label:'Archived sample analysis'};
 if(!state.resumeText.trim())return {score:null,reasons:[],label:'Add résumé text in Admin or select a draft to compare.'};
 const title=words(job.title),keywords=[...words(job.title+' '+job.role)],same=keywords.filter(x=>resumeTerms.has(x));
 const score=Math.round(100*(0.45*[...title].filter(x=>resumeTerms.has(x)).length/Math.max(1,title.size)+0.55*same.length/Math.max(1,keywords.length)));
 return {score,label:'Local keyword similarity',reasons:['Shared terms: '+(same.slice(0,10).join(', ')||'none found')+'.','Role terms to review: '+(keywords.filter(x=>!resumeTerms.has(x)).slice(0,10).join(', ')||'none')+'.']};
}
let refreshQueued=false;
async function refresh(){
 if(refreshing){refreshQueued=true;return}
 refreshing=true;render();
 let snapshot;
 try{const response=await fetch('https://raw.githubusercontent.com/holyshiite/job-agent/main/data/jobs.json',{cache:'no-store',signal:AbortSignal.timeout(6000)});if(response.ok)snapshot=await response.json()}catch{}
 await Promise.allSettled(Object.values(state.sources).flat().map(async name=>{
  const config=identifyFeed(state.sourceUrls[name])||(Object.hasOwn(feeds,name)?feeds[name]:null);
  const crawlUrl=state.pageAccess[name]===true?sourceUrl(name):'';
  if(!config&&!crawlUrl){statuses.set(name,sourceUrl(name)?'Career page / job alert · import available':'Add a supported ATS URL or import a posting');return}
  const cached=!state.sourceUrls[name]&&snapshot?.sources?.[name];
  let result=cached;
  if(!cached?.refreshedAt||Date.now()-Date.parse(cached.refreshedAt)>8*3600000){
   if(config){try{result={jobs:await loadFeed(name,config),refreshedAt:new Date().toISOString(),via:'API'}}catch{}}
   if(!result&&crawlUrl){try{result={jobs:await inspectCareerPage(name,crawlUrl),refreshedAt:new Date().toISOString(),via:'Career page'}}catch{}}
  }
  if(!Array.isArray(result?.jobs)){statuses.set(name,'Automatic pull unavailable · open source or import an alert');return}
  for(let i=sampleJobs.length-1;i>=0;i--)if(sampleJobs[i].source===name&&sampleJobs[i].id.startsWith('feed:'))sampleJobs.splice(i,1);
  sampleJobs.push(...result.jobs);
  if(result.refreshedAt>lastRefresh)lastRefresh=result.refreshedAt;
  statuses.set(name,(Date.now()-Date.parse(result.refreshedAt)>8*3600000?'Cached '+(result.via||'API'):(result.via||'API'))+' · '+result.jobs.length+' listings');
 }));
 refreshing=false;render();
 if($('settings').open)for(const el of $('settings').querySelectorAll('[data-feed-status]'))el.textContent=statuses.get(el.dataset.feedStatus)||'Unknown';
 if(refreshQueued){refreshQueued=false;void refresh()}
}
function sourceStatus(name){const url=sourceUrl(name);return '<p class="minor"><span data-feed-status="'+escape(name)+'">'+escape(statuses.get(name)||'Checking source…')+'</span>'+(url?' · <a href="'+escape(url)+'" target="_blank" rel="noopener noreferrer">Open source</a>':'')+'</p>'}

const linked=id=>{const job=lookup(id);return job?job.title+' · '+job.source:'No linked posting'};
const button=(label,action,value='',cls='')=>'<button class="'+cls+'" data-action="'+action+'" data-value="'+escape(value)+'">'+escape(label)+'</button>';
function notice(message){$('status').textContent=message}
function change(update){const next=structuredClone(state);update(next);try{localStorage.setItem(key,JSON.stringify(next));state=next;render();return true}catch{notice('The browser could not save this change. Storage may be full or disabled.');return false}}
function sourceFilters(){return '<div class="flex spread"><strong>Job sources</strong><span class="minor">'+state.selected.length+' selected</span>'+button(refreshing?'Refreshing…':'Refresh listings','refresh')+'</div>'+Object.entries(state.sources).map(([kind,names])=>'<div class="filter-row"><strong>'+(kind==='companies'?'Companies':'Job boards')+'</strong><div class="chips">'+names.map(name=>'<label class="chip"><input type="checkbox" data-source="'+escape(name)+'" '+(state.selected.includes(name)?'checked':'')+'> '+escape(name)+'</label>').join('')+'</div></div>').join('')}
function sourceSidebar(){return '<aside class="panel stack"><h3>Selected sources</h3>'+Object.entries(state.sources).map(([kind,names])=>'<strong class="minor">'+(kind==='companies'?'Companies':'Job boards')+'</strong>'+names.filter(name=>state.selected.includes(name)).map(name=>{const jobs=sampleJobs.filter(j=>j.source===name&&j.url);return '<details data-group="'+escape(name)+'" '+(expanded.has(name)?'open':'')+'><summary>'+escape(name)+' ('+jobs.length+')</summary>'+sourceStatus(name)+jobs.slice(0,8).map(j=>button(j.title,'open',j.id)).join('')+'</details>'}).join('')).join('')+'</aside>'}
function jobTable(jobs,mode){
 if(!jobs.length)return '<p class="minor">'+({matches:'No live or imported listings for the selected sources yet.',saved:'Check Save beside a listing to see it here.',submitted:'Mark a posting as submitted to track it here.'})[mode]+'</p>';
 const tail=mode==='submitted'?'<th>Submitted</th><th>Résumé</th>':'<th>Save</th><th>Application</th>';
 return '<div class="table-scroll"><table><thead><tr><th>Job title</th><th>Date posted</th><th>Match</th>'+tail+'</tr></thead><tbody>'+jobs.map(j=>{const {score}=assess(j);const entry=state.submitted[j.id];const resume=state.resumes.find(r=>r.id===entry?.resume);return '<tr class="'+(activeJob===j.id?'active':'')+'"><td>'+button(j.title,'open',j.id,'title-button')+'<div class="minor">'+escape(j.source+' · '+j.location)+'</div></td><td>'+date(j.posted)+(j.dateLabel==='Updated'?' (updated)':'')+'</td><td><span class="badge">'+(score===null?'—':score+'%')+'</span></td>'+(mode==='submitted'?'<td>'+date(entry.date)+'</td><td>'+escape(resume?.name||'No résumé linked')+'</td>':'<td><input type="checkbox" aria-label="Save '+escape(j.title)+'" data-save="'+j.id+'" '+(state.saved.includes(j.id)?'checked':'')+'></td><td>'+(entry?'<span class="minor">Submitted</span>':button('Mark submitted','submit',j.id))+'</td>')+'</tr>'}).join('')+'</tbody></table></div>';
}
function jobDrawer(job){const {score,reasons,label}=assess(job);return '<aside class="panel stack drawer" aria-label="Job details"><div class="flex spread"><span class="minor">Job details</span>'+button('Close','close')+'</div><h2>'+escape(job.title)+'</h2>'+(safeUrl(job.url)?'<a href="'+escape(job.url)+'" target="_blank" rel="noopener noreferrer" class="posting-link">Open original job posting ↗</a>':'')+'<p class="minor">'+escape(job.source+' · '+job.location)+' · '+(job.dateLabel||'Posted')+' '+date(job.posted)+'</p><div><span class="badge">'+(score===null?'No résumé comparison yet':score+'% résumé similarity')+'</span></div><h3>About the role</h3><p>'+escape(job.role)+'</p><section class="analysis"><h3>Why this was selected</h3><p class="minor">'+escape(label)+'</p><ul>'+reasons.map(reason=>'<li>'+escape(reason)+'</li>').join('')+'</ul></section>'+button('Propose a revised résumé','draft',job.id,'primary')+'</aside>'}
function resumesTable(){return '<div class="flex spread"><h2>Résumé drafts</h2>'+button('Upload résumé','admin','','primary')+'</div>'+(state.resumes.length?'<div class="table-scroll"><table><thead><tr><th>Résumé</th><th>Linked posting</th><th>Updated</th><th>Type</th><th>Actions</th></tr></thead><tbody>'+state.resumes.map(r=>'<tr><td>'+escape(r.name)+'</td><td>'+escape(linked(r.job))+'</td><td>'+date(r.date)+'</td><td>'+escape(r.type)+'</td><td><div class="flex">'+button('Download','download',r.id)+button(r.type==='Draft'?'Edit':'Link posting','edit',r.id)+(r.type==='Draft'?button('Use for matching','use-resume',r.id):'')+button('Remove','remove-resume',r.id)+'</div></td></tr>').join('')+'</tbody></table></div>':'<p class="minor">Upload a résumé or create a draft from a job posting.</p>')}
function render(){
 resumeTerms=words(state.resumeText);
 document.documentElement.dataset.theme=state.theme;$('today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});$('refresh').textContent=refreshing?'Refreshing listings…':lastRefresh?'Last refreshed · '+new Date(lastRefresh).toLocaleString():'No feed refresh yet';
 $('filters').hidden=tab!=='matches';$('filters').innerHTML=sourceFilters();
 $('tabs').innerHTML=Object.entries(tabs).map(([id,label])=>'<button data-action="tab" data-value="'+id+'" aria-current="'+(tab===id?'page':'false')+'" class="'+(tab===id?'soft':'')+'">'+label+'</button>').join('');
 const job=lookup(activeJob);
 if(tab==='resumes'){$('view').innerHTML='<section class="panel single stack">'+resumesTable()+'</section>';return}
 const jobs=tab==='matches'?sampleJobs.filter(j=>j.url&&state.selected.includes(j.source)):(tab==='saved'?state.saved:Object.keys(state.submitted)).map(lookup).filter(Boolean);
 const scores=new Map(jobs.map(job=>[job.id,assess(job).score??-1]));
 jobs.sort((a,b)=>sort==='date'?b.posted.localeCompare(a.posted):scores.get(b.id)-scores.get(a.id));
 const panel='<section class="panel stack"><div class="flex spread"><div><h2>'+tabs[tab]+'</h2><p class="minor">'+jobs.length+' '+(jobs.length===1?'listing':'listings')+'</p></div>'+(tab==='matches'?'<label>Sort <select id="sort"><option value="match">Best match</option><option value="date" '+(sort==='date'?'selected':'')+'>Newest</option></select></label>':'')+'</div>'+jobTable(jobs,tab)+'</section>';
 $('view').innerHTML=tab==='matches'?'<div class="workspace '+(job?'open':'')+'">'+sourceSidebar()+panel+(job?jobDrawer(job):'')+'</div>':'<div class="single stack">'+panel+(job?jobDrawer(job):'')+'</div>';
}
function jobOptions(id=''){return '<option value="">No linked posting</option>'+[...new Map([...Object.values(state.archive),...sampleJobs].map(j=>[j.id,j])).values()].filter(j=>j.url||j.id===id).map(j=>'<option value="'+j.id+'" '+(j.id===id?'selected':'')+'>'+escape(linked(j.id))+'</option>').join('')}
function settings(){
 $('settings').innerHTML='<div class="stack"><div class="flex spread"><h2>Admin settings</h2>'+button('Close','dismiss-settings')+'</div><label><input type="checkbox" id="dark" '+(state.theme==='dark'?'checked':'')+'> Dark mode</label>'+Object.entries(state.sources).map(([kind,names])=>'<section class="stack"><h3>'+ (kind==='companies'?'Companies':'Job boards')+'</h3><form class="flex" data-kind="'+kind+'"><input name="source" maxlength="60" required aria-label="Source name" placeholder="Add a source"><input name="url" type="url" aria-label="Careers or ATS URL" placeholder="Careers or ATS URL (optional)"><label><input name="page-access" type="checkbox"> This site permits automated reads</label><button class="primary">Add</button></form><div class="flex">'+names.map(name=>'<button type="button" data-action="select-removal" data-kind="'+kind+'" data-value="'+escape(name)+'" aria-pressed="'+removalSelection[kind].has(name)+'">'+escape(name)+'</button>').join('')+ '<button type="button" data-action="remove-selected" data-value="'+kind+'" '+(removalSelection[kind].size?'':'disabled')+'>Remove selected</button>'+'</div>'+names.map(name=>sourceStatus(name)+(sourceUrl(name)&&!feeds[name]?'<label class="minor"><input type="checkbox" data-page-access="'+escape(name)+'" '+(state.pageAccess[name]===true?'checked':'')+'> This site permits automated reads for '+escape(name)+'</label>':'')).join('')+'</section>').join('')+'<form id="profile" class="stack"><h3>Résumé matching</h3><label>Résumé text <textarea name="resume" maxlength="40000">'+escape(state.resumeText)+'</textarea></label><button class="primary">Use for matching</button><p class="minor">Résumé text stays in this browser.</p></form><form id="import-job" class="stack"><h3>Import a posting or job alert</h3><label>Source <select name="source" required>'+Object.values(state.sources).flat().map(name=>'<option>'+escape(name)+'</option>').join('')+'</select></label><label>Posting URL <input name="url" type="url" required></label><label>Job title <input name="title" required maxlength="200"></label><label>Description <textarea name="role" required maxlength="15000"></textarea></label><button class="primary">Import posting</button></form><form id="upload" class="stack"><h3>Upload résumé</h3><label>File <input type="file" name="resume" accept=".pdf,.docx,.txt" required></label><label>Posting <select name="job">'+jobOptions()+'</select></label><button class="primary">Save upload</button><p class="minor">Files stay in this browser. Up to 2 MB per file, subject to browser storage limits.</p></form></div>';
 if(!$('settings').open)$('settings').showModal();
}
function showEditor(action,id){
 const resume=state.resumes.find(r=>r.id===id),job=lookup(id);
 if(action==='submit'){
  $('editor').innerHTML='<form id="submission" class="stack" data-id="'+id+'"><h2>Mark as submitted</h2><p>'+escape(linked(id))+'</p><label>Résumé used <select name="resume"><option value="">No résumé linked</option>'+state.resumes.map(r=>'<option value="'+r.id+'" '+(r.job===id?'selected':'')+'>'+escape(r.name)+'</option>').join('')+'</select></label><div class="flex">'+button('Cancel','dismiss-editor')+'<button class="primary">Record submission</button></div></form>';
 }else{
  const upload=resume?.type==='Upload';
  const suggested=job?('Target role: '+job.title+' at '+job.source+'\n\nProfessional summary\n[Summarize relevant experience.]\n\nExperience\n[Add verified achievements relevant to: '+job.role+']\n\nSkills\n[List relevant skills you can substantiate.]'):'';
  $('editor').innerHTML='<form id="draft-form" class="stack" data-id="'+escape(resume?.id||'')+'"><h2>'+ (upload?'Link uploaded résumé':resume?'Edit résumé draft':'Propose a revised résumé')+'</h2><label>Name <input name="name" required maxlength="120" value="'+escape(resume?.name||(job?'Dani — '+job.title:''))+'"></label><label>Posting <select name="job">'+jobOptions(resume?.job||job?.id)+'</select></label>'+ (upload?'':'<label>Draft text <textarea name="text" required>'+escape(resume?.text||suggested)+'</textarea></label><p class="minor">This is an editable starter draft. Add only experience you can verify.</p>')+'<div class="flex">'+button('Cancel','dismiss-editor')+'<button class="primary">Save résumé</button></div></form>';
 }
 $('editor').showModal();
}
document.addEventListener('click',event=>{
 const opener=event.target.closest('button[data-action]');
 if(event.target.closest('#admin')){settings();return}
 if(!opener)return;
 const {action,value}=opener.dataset;
 if(opener.closest('form'))event.preventDefault();
 if(action==='tab'){tab=value;activeJob=null;render()}
 if(action==='open'){activeJob=value;render();$('view').querySelector('.drawer button')?.focus()}
 if(action==='close'){const id=activeJob;activeJob=null;render();$('view').querySelector('[data-action="open"][data-value="'+id+'"]')?.focus()}
 if(action==='admin')settings();
 if(action==='refresh')void refresh();
 if(action==='use-resume'){const resume=state.resumes.find(x=>x.id===value);if(resume?.text&&change(s=>{s.resumeText=resume.text}))notice('Résumé draft selected for matching.');}
 if(action==='dismiss-settings')$('settings').close();
 if(action==='dismiss-editor')$('editor').close();
 if(action==='draft'||action==='edit'||action==='submit')showEditor(action,value);
 if(action==='select-removal'){
  const selected=removalSelection[opener.dataset.kind];
  if(selected.has(value))selected.delete(value);else selected.add(value);
  opener.setAttribute('aria-pressed',selected.has(value));
  opener.parentElement.querySelector('[data-action="remove-selected"]').disabled=!selected.size;
 }
 if(action==='remove-selected'){
  const selected=removalSelection[value];
  if(!selected.size)return;
  if(change(s=>{s.sources[value]=s.sources[value].filter(name=>!selected.has(name));s.selected=s.selected.filter(name=>!selected.has(name));for(const name of selected){delete s.sourceUrls[name];delete s.pageAccess[name]}})){
   const count=selected.size;selected.clear();settings();
   $('settings').querySelector('[data-kind="'+value+'"] input').focus();
   notice(count+' '+(count===1?'source':'sources')+' removed.');
  }
 }
 if(action==='remove-resume'&&confirm('Remove this résumé from this browser?'))change(s=>{s.resumes=s.resumes.filter(r=>r.id!==value);for(const entry of Object.values(s.submitted))if(entry.resume===value)entry.resume=''});
 if(action==='download'){const r=state.resumes.find(x=>x.id===value);if(!r)return;const a=document.createElement('a');a.href=r.data||URL.createObjectURL(new Blob([r.text],{type:'text/plain'}));a.download=r.type==='Upload'?r.name:r.name+'.txt';a.click();if(!r.data)setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
});
$('settings').addEventListener('close',()=>Object.values(removalSelection).forEach(selected=>selected.clear()));
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.dataset.source){const name=el.dataset.source,on=el.checked;if(!change(s=>{s.selected=on?[...new Set([...s.selected,name])]:s.selected.filter(n=>n!==name)}))el.checked=!on}
 if(el.dataset.pageAccess){const name=el.dataset.pageAccess,on=el.checked;if(change(s=>{s.pageAccess[name]=on}))void refresh();else el.checked=!on}
 if(el.dataset.save){const id=el.dataset.save,on=el.checked;if(!change(s=>{if(on)remember(s,id);s.saved=on?[...new Set([...s.saved,id])]:s.saved.filter(n=>n!==id)}))el.checked=!on;else $('view').querySelector('[data-save="'+id+'"]')?.focus()}
 if(el.id==='sort'){sort=el.value;render();$('sort').focus()}
 if(el.id==='dark'){const on=el.checked;if(!change(s=>{s.theme=on?'dark':'light'}))el.checked=!on}
});
document.addEventListener('toggle',event=>{const el=event.target;if(!el.dataset.group)return;if(el.open)expanded.add(el.dataset.group);else expanded.delete(el.dataset.group)},true);
document.addEventListener('submit',async event=>{
 event.preventDefault();
 const form=event.target,data=new FormData(form);
 if(form.dataset.kind){const name=String(data.get('source')).trim();if(!name||['__proto__','constructor','prototype'].includes(name.toLowerCase()))return;if(Object.values(state.sources).flat().some(s=>s.toLowerCase()===name.toLowerCase())){form.elements.source.setCustomValidity('That source already exists.');form.elements.source.reportValidity();form.elements.source.addEventListener('input',()=>form.elements.source.setCustomValidity(''),{once:true});return}if(change(s=>{s.sources[form.dataset.kind].push(name);s.selected.push(name);const url=safeUrl(data.get('url'));if(url){s.sourceUrls[name]=url;if(data.get('page-access'))s.pageAccess[name]=true}})){settings();void refresh();}return}
 if(form.id==='profile'){if(change(s=>{s.resumeText=String(data.get('resume')).trim()})){$('settings').close();notice('Résumé text updated for local matching.')}return}
 if(form.id==='import-job'){
  const url=safeUrl(data.get('url')),source=String(data.get('source')),title=String(data.get('title')).trim(),role=String(data.get('role')).trim();
  if(!url||!title||!role){alert('Enter an HTTPS posting URL, job title, and description.');return}
  if(sampleJobs.some(job=>job.url===url)){alert('This posting is already listed.');return}
  const job={id:'import:'+crypto.randomUUID(),source,title,role,url,posted:'',location:'Imported posting'};
  if(change(s=>{s.imports.push(job);s.selected=[...new Set([...s.selected,source])]})){sampleJobs.push(job);$('settings').close();tab='matches';activeJob=job.id;render();notice('Posting imported.')}return;
 }
 if(form.id==='upload'){
  const file=data.get('resume');if(!file.size||file.size>2*1024*1024||!/[.](pdf|docx|txt)$/i.test(file.name)){alert('Choose a PDF, DOCX, or TXT file up to 2 MB.');return}
  const reader=new FileReader();reader.onerror=()=>alert('The file could not be read.');reader.onload=()=>{const encoded=String(reader.result).split(',')[1];if(change(s=>s.resumes.unshift({id:crypto.randomUUID(),name:file.name,job:String(data.get('job')),date:new Date().toISOString(),type:'Upload',data:'data:application/octet-stream;base64,'+encoded}))){$('settings').close();tab='resumes';render();notice('Résumé uploaded to this browser.')}else alert('Browser storage could not save the file.');};reader.readAsDataURL(file);return;
 }
 if(form.id==='submission'){if(change(s=>{remember(s,form.dataset.id);s.submitted[form.dataset.id]={date:new Date().toISOString(),resume:String(data.get('resume'))}})){$('editor').close();tab='submitted';activeJob=null;render();notice('Submission recorded.')}return}
 if(form.id==='draft-form'){
  const name=String(data.get('name')).trim();if(!name)return;
  if(change(s=>{const existing=s.resumes.find(r=>r.id===form.dataset.id);const job=String(data.get('job'));if(job)remember(s,job);const values={name,job,date:new Date().toISOString()};if(existing){Object.assign(existing,values);if(existing.type==='Draft')existing.text=String(data.get('text'))}else s.resumes.unshift({...values,id:crypto.randomUUID(),type:'Draft',text:String(data.get('text'))})})){$('editor').close();tab='resumes';activeJob=null;render();notice('Résumé saved.')}
 }
});

const defaultCompanionEndpoint='https://dani-job-companion.holyshiite-job-agent.workers.dev/chat';
const mascot=$('job-mascot');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const emotes=[['wave',''],['wink',''],['kiss','♥'],['hop',''],['sparkle','✦']];
let nextEmote=0;
setInterval(()=>{
 if(document.hidden||reducedMotion.matches||$('companion-dialog').open)return;
 const [name,effect]=emotes[nextEmote];
 nextEmote=(nextEmote+1)%emotes.length;
 mascot.querySelector('.mascot-effect').textContent=effect;
 mascot.dataset.emote=name;
 setTimeout(()=>{delete mascot.dataset.emote},1500);
},30000);

let companionEndpoint=defaultCompanionEndpoint,companionCredential='',companionHistory=[],companionRequest=null;
try{companionEndpoint=localStorage.getItem('job-companion-endpoint')||defaultCompanionEndpoint}catch{}
const companionStatus=message=>{$('companion-state').textContent=message};
const companionForm=$('companion-form');
const connectionForm=$('companion-connection');
function updateCompanion(){
 const connected=!!(companionEndpoint&&companionCredential);
 $('send-companion').disabled=!connected||!!companionRequest;
 $('configure-companion').textContent=connected?'Connection':'Connect';
 const job=lookup(activeJob);
 companionForm.elements.job.disabled=!job;
 companionForm.elements.resume.disabled=!state.resumeText.trim();
 companionStatus(connected?(job?'Selected posting: '+job.title:'Ask about job search, résumés, or interviews.'):'Connect a deployed OpenAI backend to start chatting.');
}
function showMessage(role,value){
 const line=document.createElement('p');
 line.className='companion-message '+role;
 line.textContent=(role==='user'?'You: ':'Companion: ')+value;
 $('companion-log').append(line);
 line.scrollIntoView({block:'nearest'});
}
$('open-companion').addEventListener('click',()=>{updateCompanion();$('companion-dialog').showModal()});
$('close-companion').addEventListener('click',()=>$('companion-dialog').close());
$('configure-companion').addEventListener('click',()=>{
 connectionForm.hidden=!connectionForm.hidden;
 if(!connectionForm.hidden){connectionForm.elements.endpoint.value=companionEndpoint;connectionForm.elements.endpoint.focus()}
});
$('clear-companion').addEventListener('click',()=>{
 companionRequest?.abort();companionRequest=null;companionHistory=[];$('companion-log').replaceChildren();updateCompanion();
});
connectionForm.addEventListener('submit',event=>{
 event.preventDefault();event.stopPropagation();
 const endpoint=safeUrl(connectionForm.elements.endpoint.value);
 if(!endpoint||new URL(endpoint).pathname!=='/chat'||new URL(endpoint).search||new URL(endpoint).hash){companionStatus('Enter an HTTPS backend URL ending in /chat.');return}
 const credential=connectionForm.elements.credential.value.trim();
 if(!credential||credential.length>512||/\s/.test(credential)){companionStatus('Enter a valid companion access token.');return}
 if(endpoint!==companionEndpoint){companionRequest?.abort();companionRequest=null;companionHistory=[];$('companion-log').replaceChildren()}
 companionEndpoint=endpoint;companionCredential=credential;
 try{localStorage.setItem('job-companion-endpoint',endpoint)}catch{}
 connectionForm.elements.credential.value='';connectionForm.hidden=true;updateCompanion();
});
companionForm.addEventListener('submit',async event=>{
 event.preventDefault();event.stopPropagation();
 if(!companionCredential||!companionEndpoint||companionRequest)return;
 const question=companionForm.elements.question.value.trim();
 if(!question)return;
 const posting=lookup(activeJob);
 const job=posting&&companionForm.elements.job.checked?[posting.title,posting.source,posting.url,posting.role].filter(Boolean).join('\n').slice(0,12000):'';
 const resume=companionForm.elements.resume.checked&&!companionForm.elements.resume.disabled?state.resumeText.slice(0,16000):'';
 const controller=new AbortController();
 companionRequest=controller;updateCompanion();companionStatus('Waiting for the companion…');
 const timer=setTimeout(()=>controller.abort(),45000);
 try{
  const response=await fetch(companionEndpoint,{method:'POST',credentials:'omit',redirect:'error',signal:controller.signal,
   headers:{'Content-Type':'application/json',Authorization:'Bearer '+companionCredential},
   body:JSON.stringify({question,job,resume,history:companionHistory.slice(-8)})});
  const body=await response.json();
  if(!response.ok||typeof body.reply!=='string')throw Error(body.error||'The companion could not answer.');
  if(companionRequest!==controller)return;
  showMessage('user',question);showMessage('assistant',body.reply);
  companionHistory=[...companionHistory,{role:'user',text:question},{role:'assistant',text:body.reply}].slice(-8);
  companionForm.elements.question.value='';companionForm.elements.resume.checked=false;
  companionRequest=null;updateCompanion();
 }catch(error){
  if(companionRequest!==controller)return;
  companionRequest=null;updateCompanion();companionStatus(error.name==='AbortError'?'The request timed out. Try again.':error.message||'Could not connect to the backend.');
 }finally{clearTimeout(timer)}
});

render();
void refresh();
</script>
</body>
</html>
